<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wordpeak — slang imposter</title>
    <meta
      name="description"
      content="Spot the slang word that doesn't belong. One imposter from a different decade hides among three natives."
    />
    <meta name="theme-color" content="#f3ecdb" />
    <meta name="color-scheme" content="light" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="wordpeak — slang imposter" />
    <meta
      property="og:description"
      content="Three slang words from one decade. One imposter from another. Spot it."
    />
    <meta property="og:url" content="https://wordpeak.app/" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://wordpeak.app/" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="hdr">
      <div class="brand">
        <span class="brand-mark">wordpeak</span>
        <span class="brand-tag">spot the slang imposter</span>
      </div>
      <div class="score">
        <div class="score-cell">
          <span class="score-val" id="score-points">0</span>
          <span class="score-lbl">score</span>
        </div>
        <div class="score-cell">
          <span class="score-val">
            <span id="score-streak">0</span><span class="streak-fire" id="streak-fire" hidden></span>
          </span>
          <span class="score-lbl">streak</span>
        </div>
        <div class="score-cell">
          <span class="score-val" id="score-best">0</span>
          <span class="score-lbl">best</span>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="prompt">
        <div class="prompt-lead">spot the imposter</div>
        <h1 class="imposter-title" id="imposter-title">—</h1>
        <div class="prompt-sub">three belong · one is from a different decade</div>
      </section>

      <section class="imposter-stage">
        <div class="imp-grid" id="imp-grid"></div>
      </section>

      <section class="controls">
        <div class="result" id="result" aria-live="polite"></div>
        <div class="controls-buttons">
          <button class="btn" id="next-btn" type="button" hidden>
            next round →
          </button>
        </div>
      </section>
    </main>

    <footer class="ftr">
      <span>slang dates are best-effort — eras blur at the edges</span>
    </footer>

    <script type="module" src="./game.js?v=slang1"></script>
  </body>
</html>
