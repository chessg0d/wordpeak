<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wordpeak — guess the curve</title>
    <meta
      name="description"
      content="A daily-style guessing game built on Google Books Ngram data. Four unlabeled curves, one target word — pick the one that fits."
    />
    <meta name="theme-color" content="#f3ecdb" />
    <meta name="color-scheme" content="light" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="wordpeak — guess the curve" />
    <meta
      property="og:description"
      content="Four Google Books Ngram curves, one word. Pick the one that fits."
    />
    <meta property="og:url" content="https://wordpeak.app/" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://wordpeak.app/" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="hdr">
      <div class="brand">
        <span class="brand-mark">wordpeak</span>
        <span class="brand-tag">a curve-guessing game</span>
      </div>
      <div class="mode-switch" role="tablist" aria-label="game mode">
        <button class="mode-btn active" id="mode-single" type="button" role="tab" aria-selected="true">solo</button>
        <button class="mode-btn" id="mode-duel" type="button" role="tab" aria-selected="false">duel</button>
      </div>
      <div class="score">
        <div class="score-cell">
          <span class="score-val" id="score-correct">0</span>
          <span class="score-lbl">correct</span>
        </div>
        <div class="score-cell">
          <span class="score-val" id="score-total">0</span>
          <span class="score-lbl">rounds</span>
        </div>
        <div class="score-cell">
          <span class="score-val" id="score-streak">0</span>
          <span class="score-lbl">streak</span>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="answer" id="answer" hidden>
        <div class="answer-text" id="answer-text"></div>
      </section>

      <section class="prompt" id="prompt-single">
        <div class="prompt-lead">which curve charts the word</div>
        <h1 class="target" id="target">—</h1>
        <div class="prompt-sub">
          usage frequency in the Google Books English corpus,
          <span id="year-range">1800–2019</span>
        </div>
      </section>

      <section class="prompt" id="prompt-duel" hidden>
        <div class="prompt-lead">match the curves · two words, one chart</div>
        <h1 class="duel-title">
          <span class="quote">“</span><em id="duel-word-a">—</em><span class="quote">”</span>
          <span class="duel-vs">vs</span>
          <span class="quote">“</span><em id="duel-word-b">—</em><span class="quote">”</span>
        </h1>
        <div class="prompt-sub">
          which curve is <em id="duel-question-word">—</em>?
        </div>
      </section>

      <section class="grid" id="grid"></section>

      <section class="duel-stage" id="duel-stage" hidden>
        <div class="duel-card" id="duel-card"></div>
        <div class="duel-picker">
          <button class="duel-pick" id="duel-pick-a" type="button">
            <span class="duel-letter">A</span>
          </button>
          <button class="duel-pick" id="duel-pick-b" type="button">
            <span class="duel-letter">B</span>
          </button>
        </div>
      </section>

      <section class="controls">
        <div class="result" id="result" aria-live="polite"></div>
        <div class="controls-buttons">
          <button
            class="btn btn-secondary"
            id="ask-gemini"
            type="button"
            hidden
          >
            <span class="gemini-spark" aria-hidden="true">✦</span>
            ask gemini why
          </button>
          <button class="btn" id="next-btn" type="button" hidden>
            next word →
          </button>
        </div>
      </section>

    </main>

    <footer class="ftr">
      <span
        >data: Google Books Ngram Viewer · curves normalized to each word's
        own peak</span
      >
    </footer>

    <script type="module" src="./game.js"></script>
  </body>
</html>
